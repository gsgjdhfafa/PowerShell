services:
  bot:
    build: .
    container_name: zf-bot
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: zf-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}
    env_file: .env
    depends_on:
      - bot
    profiles: ["tunnel"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
